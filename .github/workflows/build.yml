name: Build Sora Bar Preview
on:
  workflow_dispatch:
  push:
    branches: [main, 'sorabar/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check resources and project
        run: python3 Scripts/verify-source.py
      - name: Run inherited macOS 27 core tests
        run: swift test
      - name: Build locally signed app and package disk image
        run: bash Scripts/package-preview.sh
      - name: Bundle matching GPL source
        run: git archive --format=zip --prefix=SoraBar-source/ --output=dist/SoraBar-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: SoraBar-preview-Mac-download
          if-no-files-found: error
          path: |
            dist/SoraBar-preview.zip
            dist/SoraBar-preview.dmg
            dist/SoraBar-source.zip
      - name: Save build log if compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SoraBar-build-log
          if-no-files-found: ignore
          path: build/build.log
